<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava - IPI Akademija</title>
    
    <!-- UČITAJ TEMU ODMAH -->
    <script>
        (function() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (currentUser && currentUser.theme && currentUser.theme !== 'default') {
                document.documentElement.setAttribute('data-theme', currentUser.theme);
            }
        })();
    </script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>IPI<span>Akademija</span></h1>
                <h2>Dobrodošli nazad</h2>
                <p>Prijavite se na vaš nalog</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email adresa</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="vas@email.com" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Lozinka</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                    >
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        <span>Zapamti me</span>
                    </label>
                    <a href="#" class="forgot-link">Zaboravili ste lozinku?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Prijavi se
                </button>

                <div class="form-divider">
                    <span>ili</span>
                </div>

                <button type="button" class="btn btn-google btn-full">
                    Nastavi sa Google
                </button>

                <div class="auth-footer">
                    <p>Nemate profil? <a href="register.html">Registrujte se</a></p>
                    <p><a href="index.html">← Nazad na početnu</a></p>
                </div>
            </form>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="successMessage" class="success-message" style="display: none;"></div>
        </div>

        <div class="auth-sidebar">
            <div class="sidebar-content">
                <h3>Započnite svoju putanju</h3>
                <ul class="feature-list">
                    <li>
                        <span class="feature-icon">✓</span>
                        <span>Personalni dashboard za praćenje napretka</span>
                    </li>
                    <li>
                        <span class="feature-icon">✓</span>
                        <span>Trackeri za navike, učenje i fitness</span>
                    </li>
                    <li>
                        <span class="feature-icon">✓</span>
                        <span>Student Fun Zone sa igrama</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const result = await window.authManager.login(email, password);
            
            if (result.success) {
                showAuthMessage(result.message, 'success');
                // Ovdje ćeš kasnije dodati Angular integraciju
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showAuthMessage(result.message, 'error');
            }
        });
    </script>
</body>
</html>
